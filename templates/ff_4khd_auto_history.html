{% extends "base.html" %}
{% block content %}
<div>
  {{ macros.m_button_group([['global_refresh_btn', '새로고침'], ['global_clear_btn', '전체 초기화']]) }}
  <hr>

  <!-- 필터 -->
  <div class="mb-3">
    <div class="input-group" style="max-width: 400px;">
      <input type="text" id="history_filter" class="form-control" placeholder="키워드 또는 제목으로 필터..." style="background: #333; color: #fff; border-color: #555;">
      <div class="input-group-append">
        <button class="btn btn-outline-secondary" id="filter_clear_btn"><i class="fa fa-times"></i></button>
      </div>
    </div>
  </div>

  <!-- 히스토리 테이블 -->
  <div class="card" style="border: 1px solid #444; background: #2a2a2a;">
    <div class="card-header" style="background: #333; color: #fff;">
      <h5 class="mb-0"><i class="fa fa-history"></i> 다운로드 히스토리 <span id="history_count" class="badge badge-secondary ml-2">0</span></h5>
    </div>
    <div class="card-body p-0">
      <table class="table table-dark table-hover table-sm mb-0">
        <thead>
          <tr>
            <th style="width: 5%;">#</th>
            <th style="width: 10%;">상태</th>
            <th style="width: 35%;">제목</th>
            <th style="width: 12%;">키워드</th>
            <th style="width: 15%;">날짜</th>
            <th style="width: 23%; text-align: center;">액션</th>
          </tr>
        </thead>
        <tbody id="history_tbody">
          <tr><td colspan="6" class="text-center text-muted">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 페이징 -->
  <nav class="mt-3">
    <ul class="pagination justify-content-center" id="history_pagination"></ul>
  </nav>
</div>

<script type="text/javascript">
const package_name = "{{ arg['package_name'] }}";
let currentPage = 1;

function loadHistory(page) {
    currentPage = page || 1;
    $.ajax({
        url: '/' + package_name + '/ajax/history_list',
        type: 'POST',
        data: { page: currentPage },
        success: function(data) {
            if (data.ret === 'success') {
                renderHistory(data.data, data.total, data.page, data.total_pages);
            }
        }
    });
}

function renderHistory(items, total, page, totalPages) {
    const tbody = $('#history_tbody');
    const filter = ($('#history_filter').val() || '').toLowerCase();
    tbody.empty();
    $('#history_count').text(total);

    if (!items || items.length === 0) {
        tbody.append('<tr><td colspan="6" class="text-center text-muted">다운로드 내역이 없습니다.</td></tr>');
        return;
    }

    let idx = (page - 1) * 50;
    items.forEach(function(h) {
        // 필터
        if (filter && h.title.toLowerCase().indexOf(filter) === -1 && h.keyword.toLowerCase().indexOf(filter) === -1) {
            return;
        }
        idx++;
        const statusBadge = h.status === 'completed'
            ? '<span class="badge badge-success">✅ 완료</span>'
            : '<span class="badge badge-danger">❌ 실패</span>';

        const actions = h.status === 'completed'
            ? '<button class="btn btn-sm btn-outline-warning mr-1" onclick="redownload(\'' + encodeURIComponent(h.url) + '\', \'' + h.post_id + '\')"><i class="fa fa-refresh"></i> 재다운</button>'
            : '<button class="btn btn-sm btn-outline-info mr-1" onclick="redownload(\'' + encodeURIComponent(h.url) + '\', \'' + h.post_id + '\')"><i class="fa fa-refresh"></i> 재시도</button>';

        tbody.append(
            '<tr>' +
            '  <td>' + idx + '</td>' +
            '  <td>' + statusBadge + '</td>' +
            '  <td><span style="color: #e0e0e0;" title="' + (h.detail || '') + '">' + h.title + '</span></td>' +
            '  <td><span class="badge badge-info">' + h.keyword + '</span></td>' +
            '  <td style="color: #999; font-size: 0.85em;">' + h.date + '</td>' +
            '  <td class="text-center">' +
                 actions +
            '    <button class="btn btn-sm btn-outline-danger" onclick="deleteHistory(\'' + h.post_id + '\')"><i class="fa fa-trash"></i></button>' +
            '  </td>' +
            '</tr>'
        );
    });

    // 페이징
    const pag = $('#history_pagination');
    pag.empty();
    if (totalPages > 1) {
        for (let i = 1; i <= totalPages; i++) {
            const active = i === page ? 'active' : '';
            pag.append('<li class="page-item ' + active + '"><a class="page-link" href="#" onclick="loadHistory(' + i + '); return false;">' + i + '</a></li>');
        }
    }
}

function redownload(encodedUrl, postId) {
    const url = decodeURIComponent(encodedUrl);
    $.ajax({
        url: '/' + package_name + '/ajax/redownload',
        type: 'POST',
        data: { url: url, post_id: postId },
        success: function(data) {
            $.notify('<strong>' + data.msg + '</strong>', {type: data.ret === 'success' ? 'info' : 'warning'});
        }
    });
}

function deleteHistory(postId) {
    if (!confirm('이 기록을 삭제하시겠습니까? (다음 스캔 시 다시 다운로드될 수 있습니다)')) return;
    $.ajax({
        url: '/' + package_name + '/ajax/history_delete',
        type: 'POST',
        data: { post_id: postId },
        success: function(data) {
            if (data.ret === 'success') {
                $.notify('<strong>기록 삭제됨</strong>', {type: 'success'});
                loadHistory(currentPage);
            }
        }
    });
}

$(document).ready(function() {
    loadHistory(1);

    // 새로고침
    $(document).on('click', '#global_refresh_btn', function(e) {
        e.preventDefault();
        loadHistory(currentPage);
    });

    // 전체 초기화
    $(document).on('click', '#global_clear_btn', function(e) {
        e.preventDefault();
        if (!confirm('모든 다운로드 기록을 초기화하시겠습니까?\n(파일은 삭제되지 않으며, 다음 스캔 시 다시 다운로드됩니다)')) return;
        $.ajax({
            url: '/' + package_name + '/ajax/history_clear',
            type: 'POST',
            success: function(data) {
                if (data.ret === 'success') {
                    $.notify('<strong>히스토리 초기화 완료</strong>', {type: 'success'});
                    loadHistory(1);
                }
            }
        });
    });

    // 필터
    $('#history_filter').on('input', function() {
        loadHistory(1);
    });
    $('#filter_clear_btn').click(function() {
        $('#history_filter').val('');
        loadHistory(1);
    });
});
</script>
{% endblock %}
